name: Release Local Agent Binaries

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: |
          pip install pyinstaller

      - name: Build Windows Executable
        run: |
          pyinstaller --onefile --noconsole --name frieren-agent-win apps/local-agent/agent_gui.py

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frieren-agent-windows
          path: dist/frieren-agent-win.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: |
          pip install pyinstaller

      - name: Build Linux Binary
        run: |
          pyinstaller --onefile --name frieren-agent-linux apps/local-agent/agent_gui.py

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frieren-agent-linux
          path: dist/frieren-agent-linux

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows Binary
        uses: actions/download-artifact@v4
        with:
          name: frieren-agent-windows
          path: release/

      - name: Download Linux Binary
        uses: actions/download-artifact@v4
        with:
          name: frieren-agent-linux
          path: release/

      - name: Generate SHA256 Checksums
        run: |
          cd release
          sha256sum * > sha256sums.txt
          cat sha256sums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/frieren-agent-win.exe
            release/frieren-agent-linux
            release/sha256sums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
